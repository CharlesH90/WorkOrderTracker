services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64   # runs under Rosetta on Apple Silicon
    container_name: workorders-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "WorkOrders_Dev123!"   # local dev only
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql

volumes:
  sqldata:
