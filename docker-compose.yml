services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64   # runs under Rosetta on Apple Silicon
    container_name: workorders-sql
    environment:
      ACCEPT_EULA: "Y"
      # Read from .env (git-ignored). Copy .env.example to .env and set a strong password.
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:1433:1433"   # reachable from this machine only
    volumes:
      - sqldata:/var/opt/mssql

volumes:
  sqldata:
